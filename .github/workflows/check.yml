name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: "3.12.0"
      # Every toolchain must be present so that no step of the script is skipped in CI.
      - name: Fail instead of skipping
        run: |
          command -v node
          command -v dart
          command -v google-chrome
      - run: scripts/check.sh
