name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # ubuntu-latest ships python3, node and Google Chrome, so every step of the script runs.
      - name: Fail instead of skipping
        run: |
          command -v node
          command -v google-chrome
      - run: scripts/check.sh
