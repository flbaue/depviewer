<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dependency Viewer</title>
<style>
:root {
  --bg: #ffffff; --fg: #1d2330; --muted: #6b7385; --line: #d3d9e4; --panel: #f7f9fc; --toolbar: #eef1f6;
  --band0: #f4f7fc; --band1: #e9f0fa; --band2: #dfe9f8; --band3: #d4e2f6; --band4: #c9dbf3; --band5: #bfd4f1; --band6: #b5cdee; --band7: #abc6eb;
  --sep: #7f8aa0; --sel: #ffe27a; --peer: #fff4c2; --match: #ff9d00;
  --down: #4b9a17; --up: #2a73cc; --cyc: #d92436; --nest: #9aa3b5;
  --pkg: #b97a2e; --file: #3d6fb4; --cls: #2e8b57; --ifc: #7c4dcc; --enm: #a3742a; --rec: #198a8a; --ann: #8a5a9e;
  --mth: #3765c0; --ctor: #2f8f8f; --fld: #e39a2b; --ext: #7a8394; --mod: #4d5d80; --priv: #c8453b;
  --btn: #ffffff; --btn-b: #c3cad6; --accent: #2a73cc;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12161d; --fg: #e3e8f0; --muted: #8e98aa; --line: #2b3340; --panel: #171c24; --toolbar: #1a2029;
    --band0: #161c25; --band1: #1a222d; --band2: #1e2735; --band3: #222c3c; --band4: #263244; --band5: #2a374b; --band6: #2e3c52; --band7: #324159;
    --sep: #6f7b91; --sel: #5c4b12; --peer: #3a3418; --match: #ffb340;
    --down: #6cc23a; --up: #5ea2f0; --cyc: #ff5466; --nest: #6f7b91;
    --pkg: #d49a52; --file: #6c9be0; --cls: #4fbf82; --ifc: #a585f0; --enm: #cc9a4a; --rec: #3cbcbc; --ann: #b88ad0;
    --mth: #6f97f0; --ctor: #52c0c0; --fld: #f0b050; --ext: #8e98aa; --mod: #8898c0; --priv: #f07a70;
    --btn: #222935; --btn-b: #3a4455; --accent: #5ea2f0;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12161d; --fg: #e3e8f0; --muted: #8e98aa; --line: #2b3340; --panel: #171c24; --toolbar: #1a2029;
  --band0: #161c25; --band1: #1a222d; --band2: #1e2735; --band3: #222c3c; --band4: #263244; --band5: #2a374b; --band6: #2e3c52; --band7: #324159;
  --sep: #6f7b91; --sel: #5c4b12; --peer: #3a3418; --match: #ffb340;
  --down: #6cc23a; --up: #5ea2f0; --cyc: #ff5466; --nest: #6f7b91;
  --pkg: #d49a52; --file: #6c9be0; --cls: #4fbf82; --ifc: #a585f0; --enm: #cc9a4a; --rec: #3cbcbc; --ann: #b88ad0;
  --mth: #6f97f0; --ctor: #52c0c0; --fld: #f0b050; --ext: #8e98aa; --mod: #8898c0; --priv: #f07a70;
  --btn: #222935; --btn-b: #3a4455; --accent: #5ea2f0;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--fg); font: 13px/1.35 system-ui, -apple-system, "Segoe UI", sans-serif; display: flex; flex-direction: column; overflow: hidden; }

header { background: var(--toolbar); border-bottom: 1px solid var(--line); padding: 6px 12px; display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; }
header .brand { display: flex; flex-direction: column; min-width: 0; margin-right: auto; }
header .brand b { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
header .brand span { color: var(--muted); font-size: 11.5px; }
.grp { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.grp > .lbl { color: var(--muted); font-weight: 600; margin-right: 2px; }
.seg { display: inline-flex; border: 1px solid var(--btn-b); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; border-right: 1px solid var(--btn-b); border-radius: 0; }
.seg button:last-child { border-right: 0; }
button, .btn { font: inherit; background: var(--btn); color: var(--fg); border: 1px solid var(--btn-b); border-radius: 6px; padding: 3px 9px; cursor: pointer; }
button:hover, .btn:hover { border-color: var(--accent); }
.seg button.on { background: var(--accent); color: #fff; }
label.chk { display: inline-flex; gap: 4px; align-items: center; cursor: pointer; white-space: nowrap; }
input[type=search] { font: inherit; background: var(--btn); color: var(--fg); border: 1px solid var(--btn-b); border-radius: 6px; padding: 3px 8px; width: 170px; }

main { flex: 1; display: flex; min-height: 0; }
#view { flex: 1; overflow: auto; position: relative; min-width: 0; }
#canvas { position: relative; min-height: 100%; }
#rows { position: relative; }
#arcs { position: absolute; left: 0; top: 0; pointer-events: none; overflow: visible; }

.row { height: 24px; display: flex; align-items: center; white-space: nowrap; position: relative; cursor: default; user-select: none; }
.row.d0 { background: var(--band0); } .row.d1 { background: var(--band1); } .row.d2 { background: var(--band2); } .row.d3 { background: var(--band3); }
.row.d4 { background: var(--band4); } .row.d5 { background: var(--band5); } .row.d6 { background: var(--band6); } .row.d7 { background: var(--band7); }
.row.sep { box-shadow: inset 0 1px 0 var(--sep); }
.row.peer { background: var(--peer); }
.row.sel { background: var(--sel); }
.row.cyc::before { content: ""; position: absolute; left: 0; top: 3px; bottom: 3px; width: 4px; background: var(--cyc); border-radius: 0 2px 2px 0; }
.row.match .nm { outline: 2px solid var(--match); outline-offset: 1px; border-radius: 2px; }
.tog { width: 14px; height: 14px; flex: none; display: inline-grid; place-items: center; border: 1px solid var(--muted); border-radius: 2px; font: 12px/1 ui-monospace, monospace; color: var(--fg); margin-right: 5px; cursor: pointer; background: var(--bg); }
.tog.none { visibility: hidden; }
.nm { overflow: hidden; text-overflow: ellipsis; }
.nm.test { color: var(--muted); }
.nm.stat { font-style: italic; }
.metric { color: var(--muted); font-size: 11px; margin-left: 8px; font-variant-numeric: tabular-nums; }

.ic { width: 16px; height: 16px; flex: none; margin-right: 6px; display: inline-grid; place-items: center; font: 700 10px/1 ui-monospace, Menlo, monospace; color: #fff; border-radius: 3px; }
.k-module { background: var(--mod); } .k-module::before { content: "M"; }
.k-package, .k-ext-package { background: var(--pkg) linear-gradient(90deg, transparent 46%, rgba(255,255,255,.75) 46% 58%, transparent 58%), linear-gradient(transparent 46%, rgba(255,255,255,.75) 46% 58%, transparent 58%); }
.k-package { background-color: var(--pkg); }
.k-ext-package { background-color: var(--ext); }
.k-file { background: var(--bg); border: 1.5px solid var(--file); color: var(--file); border-radius: 2px 6px 2px 2px; width: 14px; } .k-file::before { content: "J"; }
.k-class, .k-interface, .k-enum, .k-record, .k-annotation, .k-ext-type { border-radius: 50%; }
.k-class { background: var(--cls); } .k-class::before { content: "C"; }
.k-interface { background: var(--ifc); } .k-interface::before { content: "I"; }
.k-enum { background: var(--enm); } .k-enum::before { content: "E"; }
.k-record { background: var(--rec); } .k-record::before { content: "R"; }
.k-annotation { background: var(--ann); } .k-annotation::before { content: "@"; }
.k-ext-type { background: var(--ext); } .k-ext-type::before { content: "T"; }
.k-ext-root { background: var(--ext); } .k-ext-root::before { content: "X"; }
.k-method, .k-ctor { background: var(--mth); clip-path: polygon(50% 12%, 96% 88%, 4% 88%); border-radius: 0; }
.k-ctor { background: var(--ctor); }
.k-field, .k-enumconst { width: 11px; height: 11px; margin: 0 8px 0 3px; border-radius: 50%; background: var(--fld); }
.k-enumconst { background: var(--enm); }
.ic.priv { background-color: var(--priv); }

#arcs path.arc { fill: none; stroke-linecap: round; transition: opacity .12s; }
#arcs path.down { stroke: var(--down); } #arcs path.up { stroke: var(--up); }
#arcs path.cyc { stroke: var(--cyc); } #arcs path.nest { stroke: var(--nest); stroke-dasharray: 3 3; }
#arcs.focus path.arc { opacity: .07; }
#arcs.focus path.arc.on { opacity: 1; }
#arcs path.hit { fill: none; stroke: transparent; stroke-width: 9; pointer-events: stroke; cursor: pointer; }
#arcs circle.anc { stroke: var(--bg); stroke-width: 1.5; fill: var(--muted); }
#arcs circle.anc.on { fill: var(--accent); }

aside { width: 360px; border-left: 1px solid var(--line); background: var(--panel); overflow: auto; flex: none; }
#pbody { padding: 12px 14px 24px; }
#pbody h2 { font-size: 15px; margin: 0 0 2px; display: flex; align-items: center; word-break: break-all; }
#pbody h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 16px 0 6px; }
#pbody .sub { color: var(--muted); word-break: break-all; font-size: 12px; }
#pbody .kv { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; margin-top: 8px; font-size: 12px; }
#pbody .kv span:nth-child(odd) { color: var(--muted); }
#pbody details { border-bottom: 1px solid var(--line); }
#pbody summary { cursor: pointer; padding: 4px 0; display: flex; align-items: center; gap: 0; list-style: none; }
#pbody summary::-webkit-details-marker { display: none; }
#pbody summary::before { content: "▸"; width: 14px; color: var(--muted); flex: none; }
#pbody details[open] > summary::before { content: "▾"; }
#pbody summary .nm { flex: 1; }
.cnt { color: var(--muted); font-variant-numeric: tabular-nums; margin-left: 8px; font-size: 12px; }
#pbody ul { list-style: none; margin: 0 0 6px; padding: 0 0 0 14px; font-size: 12px; }
#pbody li { padding: 3px 4px; border-radius: 4px; cursor: pointer; line-height: 1.3; word-break: break-word; }
#pbody li:hover { background: var(--peer); }
#pbody li .kind { display: inline-block; font-size: 10.5px; padding: 0 5px; border-radius: 8px; border: 1px solid var(--btn-b); color: var(--muted); margin-right: 4px; }
#pbody li .where { color: var(--muted); display: block; font-size: 11px; }
.legend { display: grid; grid-template-columns: 28px 1fr; gap: 6px 8px; align-items: center; margin-top: 6px; }
.legend i { display: block; height: 0; border-top: 2.5px solid; }
.help { color: var(--muted); font-size: 12px; }
.help p { margin: 6px 0; }
.badge { display: inline-block; background: var(--cyc); color: #fff; border-radius: 8px; padding: 0 6px; font-size: 11px; margin-left: 6px; }

select { font: inherit; background: var(--btn); color: var(--fg); border: 1px solid var(--btn-b); border-radius: 6px; padding: 3px 6px; max-width: 180px; }
.menu { position: relative; }
.menu > summary { list-style: none; }
.menu > summary::-webkit-details-marker { display: none; }
.menu-list { position: absolute; z-index: 10; top: calc(100% + 4px); left: 0; background: var(--bg); border: 1px solid var(--btn-b); border-radius: 8px; padding: 4px; min-width: 160px; box-shadow: 0 6px 20px rgba(0,0,0,.18); display: flex; flex-direction: column; }
.menu-list button { border: 0; text-align: left; padding: 5px 8px; background: transparent; }
.menu-list button:hover { background: var(--peer); }
.menu-list hr { border: 0; border-top: 1px solid var(--line); margin: 4px 0; width: 100%; }
.row.ing { box-shadow: inset 4px 0 0 var(--gc); }
.row.ing.sep { box-shadow: inset 4px 0 0 var(--gc), inset 0 1px 0 var(--sep); }
.row.grp { font-weight: 600; }
.row.drop { outline: 2px dashed var(--accent); outline-offset: -2px; }
.row[draggable="true"] { cursor: grab; }
.k-group { background: var(--gc); border-radius: 4px; }
.gact { margin-left: 8px; display: none; gap: 2px; }
.row.grp:hover .gact, .row.grp.sel .gact { display: inline-flex; }
.gact button { padding: 0 6px; font-size: 11px; line-height: 18px; }
.gname { font: inherit; font-weight: 600; padding: 1px 4px; border: 1px solid var(--accent); border-radius: 4px; background: var(--bg); color: var(--fg); width: 220px; }
body.dragging #arcs path.hit { pointer-events: none; }
#pbody li .x { float: right; border: 0; background: transparent; color: var(--muted); padding: 0 4px; }
#pbody li .x:hover { color: var(--cyc); }
#pbody select { max-width: 100%; }

#empty { padding: 40px 24px; color: var(--muted); max-width: 560px; }
#empty code { background: var(--toolbar); padding: 1px 5px; border-radius: 4px; }
body.drag #view { outline: 3px dashed var(--accent); outline-offset: -6px; }

@media (max-width: 820px) {
  main { flex-direction: column; }
  aside { width: auto; height: 38vh; border-left: 0; border-top: 1px solid var(--line); }
  input[type=search] { width: 130px; }
}
</style>
</head>
<body>
<header>
  <div class="brand"><b id="title">Dependency Viewer</b><span id="stats"></span></div>
  <div class="grp"><span class="lbl">View</span>
    <select id="viewSel" title="Physical structure, or one of your views with groups"></select>
    <button id="addGroup" title="Add an empty group (creates a view if needed)">+ Group</button>
    <details class="menu" id="viewMenu"><summary class="btn" title="View actions">⋯</summary>
      <div class="menu-list">
        <button data-m="new">New view</button>
        <button data-m="dup">Duplicate view</button>
        <button data-m="rename">Rename view</button>
        <button data-m="delete">Delete view</button>
        <hr>
        <button data-m="export">Export views…</button>
        <button data-m="import">Import views…</button>
      </div>
    </details>
    <input type="file" id="viewFile" accept=".json,application/json" hidden>
    <label class="chk" title="Hide everything that is not assigned to a group"><input type="checkbox" id="optOnly"> Only groups</label>
  </div>
  <div class="grp"><span class="lbl">Sort</span>
    <div class="seg" id="sort">
      <button data-v="levelize" class="on" title="Order siblings so that everything depends only on things below it">Levelize</button>
      <button data-v="alpha">A–Z</button>
      <button data-v="loc" title="Lines of code">Lines</button>
      <button data-v="elems" title="Number of contained types and members">Elements</button>
    </div>
  </div>
  <div class="grp"><span class="lbl">Show</span>
    <div class="seg" id="levels">
      <button data-v="1">Packages</button>
      <button data-v="2">Files</button>
      <button data-v="3">Types</button>
      <button data-v="4">Members</button>
    </div>
  </div>
  <div class="grp">
    <label class="chk"><input type="checkbox" id="optTests"> Tests</label>
    <label class="chk"><input type="checkbox" id="optExt" checked> External</label>
    <label class="chk" title="Dependencies between an element and its own parent, e.g. a method using its class"><input type="checkbox" id="optNest"> Parent deps</label>
  </div>
  <div class="grp">
    <input type="search" id="find" placeholder="Find… (Enter = next)">
    <label class="btn" title="Open a deps.json file">Open…<input type="file" id="file" accept=".json,application/json" hidden></label>
  </div>
</header>
<main>
  <div id="view">
    <div id="canvas">
      <div id="rows"></div>
      <svg id="arcs" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>
    <div id="empty" hidden>
      <p><b>No data loaded.</b></p>
      <p>Generate a viewer for a Java project with <code>depviewer path/to/project</code>, or drop a <code>deps.json</code> file here.</p>
    </div>
  </div>
  <aside><div id="pbody"></div></aside>
</main>

<script>
(() => {
'use strict';
const EMBEDDED = /*DEPS_DATA*/null;
const EMBEDDED_VIEWS = /*DEPS_VIEWS*/null;

const H = 24, IND = 16;
const LEVEL = { group: 0, module: 0, package: 1, file: 2, class: 3, interface: 3, enum: 3, record: 3, annotation: 3,
  ctor: 4, method: 4, field: 4, enumconst: 4, 'ext-root': 0, 'ext-package': 2, 'ext-type': 3 };
const KRANK = { group: -1, module: 0, package: 1, 'ext-package': 1, file: 2, 'ext-type': 2, class: 3, interface: 3, enum: 3,
  record: 3, annotation: 3, enumconst: 4, ctor: 5, method: 6, field: 7, 'ext-root': 9 };
const KIND_LABEL = { group: 'Group', module: 'Module', package: 'Package', file: 'Source file', class: 'Class', interface: 'Interface',
  enum: 'Enum', record: 'Record', annotation: 'Annotation type', ctor: 'Constructor', method: 'Method', field: 'Field',
  enumconst: 'Enum constant', 'ext-root': 'External', 'ext-package': 'External package', 'ext-type': 'External type' };
const VIS = { '+': 'public', '#': 'protected', '-': 'private', '~': 'package-private' };
const CONTAINER = new Set(['module', 'package', 'ext-root', 'ext-package']);
const UNIT = new Set(['file', 'ext-type']);
const COLORS = ['#e07a2f', '#2a9d8f', '#8e5cd9', '#e05780', '#3a86ff', '#6a994e', '#c9a227', '#577590', '#d62828', '#4d908e'];

const $ = s => document.querySelector(s);
const view = $('#view'), rowsEl = $('#rows'), svg = $('#arcs'), pbody = $('#pbody');
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const hasOwn = (o, k) => k != null && Object.prototype.hasOwnProperty.call(o, k);
const uid = () => Math.random().toString(36).slice(2, 9);

let D = null;   // loaded data (original structure)
let M = null;   // display tree for the current view
let V = { views: [], current: null };
let gen = 0, rows = [], arcs = [], active = [], rowArcs = new Map();
const st = { sort: 'levelize', tests: false, ext: true, nest: false, only: false, level: 2, expanded: new Set(),
  sel: null, selArc: null, hover: null, hoverArc: null, query: '', findPos: -1, editing: null };

// ------------------------------------------------------------------ data

function load(data) {
  const kinds = data.edgeKinds || [];
  const nodes = data.nodes.map((d, i) => ({ i, key: 'n' + i, n: d.n, k: d.k, line: d.l || 0, loc0: d.loc || 0, test0: !!d.t,
    q: d.q || d.n, path: d.path || '', v: d.v || '', st: !!d.s, op: null, oc: [] }));
  data.nodes.forEach((d, i) => { if (d.p != null) { nodes[i].op = nodes[d.p]; nodes[d.p].oc.push(nodes[i]); } });
  const byOKey = new Map();
  for (const n of nodes) { // parents come before children
    n.mod = n.op ? n.op.mod : n.n;
    n.okey = n.k === 'module' ? 'R:' + n.n : n.k === 'package' ? 'P:' + n.mod + ':' + n.q : n.k === 'file' ? 'F:' + n.mod + ':' + n.path
      : n.k === 'ext-root' ? 'X' : n.k === 'ext-package' ? 'XP:' + n.q : n.k === 'ext-type' ? 'XT:' + n.q : null;
    if (n.okey) { byOKey.set(n.okey, n); if (UNIT.has(n.k)) n.key = n.okey; }
  }
  const edges = data.edges.map(([f, t, k, c, l]) => ({ f: nodes[f], t: nodes[t], k: kinds[k] || 'uses', c: c || 1, lines: l || [] }));
  D = { title: data.title || 'Dependencies', generated: data.generated || '', errors: data.errors || 0, nodes, edges, byOKey };
  $('#title').textContent = D.title;
  document.title = D.title + ' – Dependencies';
  $('#empty').hidden = true;
  st.sel = st.selArc = st.hover = null;
  loadViews();
  build();
  expandTo(2);
  refresh();
}

// ------------------------------------------------------------------ views & groups

const storeKey = () => 'depviewer:views:' + D.title;
function loadViews() {
  let s = null;
  try { s = JSON.parse(localStorage.getItem(storeKey())); } catch (e) { s = null; }
  if (!(s && Array.isArray(s.views)) && EMBEDDED_VIEWS && Array.isArray(EMBEDDED_VIEWS.views)) s = JSON.parse(JSON.stringify(EMBEDDED_VIEWS));
  V = s && Array.isArray(s.views) ? s : { views: [], current: null };
  for (const v of V.views) { v.groups = v.groups || []; v.assign = v.assign || {}; }
  if (!V.views.some(v => v.id === V.current)) V.current = null;
  renderViewSel();
}
function saveViews() { try { localStorage.setItem(storeKey(), JSON.stringify(V)); } catch (e) { /* storage unavailable */ } }
const curView = () => V.views.find(v => v.id === V.current) || null;

function renderViewSel() {
  $('#viewSel').innerHTML = `<option value="">Physical structure</option>` +
    V.views.map(v => `<option value="${esc(v.id)}"${v.id === V.current ? ' selected' : ''}>${esc(v.name)}</option>`).join('');
  $('#optOnly').disabled = !curView();
}

function switchView(id) {
  V.current = id || null; saveViews(); renderViewSel();
  st.sel = st.selArc = null;
  build(); expandTo(st.level || 2); refresh();
}

function newView(name) {
  const v = { id: uid(), name, groups: [], assign: {} };
  V.views.push(v); switchView(v.id);
  return v;
}

function addGroup() {
  if (!D) return;
  let v = curView();
  if (!v) v = newView('View ' + (V.views.length + 1));
  const g = { id: uid(), name: 'Group ' + (v.groups.length + 1), color: COLORS[v.groups.length % COLORS.length] };
  v.groups.push(g); saveViews();
  st.editing = 'G:' + g.id;
  build(); refresh();
  view.scrollTop = 0;
}

function renameGroup(gid, name) {
  const v = curView(), g = v && v.groups.find(x => x.id === gid);
  if (g && name.trim()) { g.name = name.trim(); saveViews(); }
}

function deleteGroup(gid) {
  const v = curView(); if (!v) return;
  const g = v.groups.find(x => x.id === gid);
  const n = Object.values(v.assign).filter(x => x === gid).length;
  if (n && !confirm(`Delete group "${g.name}"? Its ${n} assignment(s) are removed; the elements go back to where they were.`)) return;
  v.groups = v.groups.filter(x => x.id !== gid);
  for (const k of Object.keys(v.assign)) if (v.assign[k] === gid) delete v.assign[k];
  saveViews(); build(); refresh();
}

const isOrigDesc = (d, o) => { for (let a = d; a; a = a.op) if (a === o) return true; return false; };
function inherited(v, o) { for (let a = o.op; a; a = a.op) if (hasOwn(v.assign, a.okey)) return v.assign[a.okey] || null; return null; }

// The original element a display node stands for when it is assigned (types/members move with their file).
function assignTarget(n) {
  if (!n || n.k === 'group') return null;
  if (n.clone) return n.origin;
  if (UNIT.has(n.k)) return n;
  return n.file || null;
}

function assign(okey, gid) {
  const v = curView(), o = D.byOKey.get(okey);
  if (!v || !o) return;
  for (const k of Object.keys(v.assign)) { const d = D.byOKey.get(k); if (d && d !== o && isOrigDesc(d, o)) delete v.assign[k]; }
  delete v.assign[okey];
  if ((gid || null) !== inherited(v, o)) v.assign[okey] = gid || '';
  saveViews();
  build();
  const d = findDisplay(o);
  if (d) for (const a of d.anc.slice(0, -1)) st.expanded.add(a.key);
  refresh();
}

function findDisplay(o) {
  if (o.gen === gen && !CONTAINER.has(o.k)) return o;
  return M.nodes.find(n => n.origins && n.origins.includes(o)) || M.nodes.find(n => UNIT.has(n.k) && isOrigDesc(n, o)) || null;
}

// Build the display tree: groups first (each with the module/package path of its elements),
// then everything not assigned, in its physical structure.
function build() {
  gen++;
  const v = curView(), asg = v ? v.assign : {};
  const mk = o => Object.assign({ children: [], parent: null, line: 0, loc0: 0, test0: false, path: '', v: '', st: false, clone: true }, o);
  const groups = v ? v.groups.map(g => mk({ key: 'G:' + g.id, n: g.name, k: 'group', q: g.name, gid: g.id, color: g.color, clone: false })) : [];
  const gById = new Map(groups.map(g => [g.gid, g]));
  const top = [], clones = new Map();
  for (const n of D.nodes) if (!CONTAINER.has(n.k)) { n.parent = n.op; n.children = n.oc.slice(); }
  const eff = n => {
    for (let a = n; a; a = a.op) if (hasOwn(asg, a.okey)) return asg[a.okey] ? gById.get(asg[a.okey]) || null : null;
    return null;
  };
  const container = (o, G) => {
    const key = (G ? G.key : '') + '/' + o.okey;
    let c = clones.get(key);
    if (c) return c;
    c = mk({ key, n: o.n, k: o.k, q: o.q, origin: o, origins: [o], mod: o.mod });
    clones.set(key, c);
    const p = o.op ? container(o.op, G) : G;
    if (p) { c.parent = p; p.children.push(c); } else top.push(c);
    return c;
  };
  for (const u of D.nodes) if (UNIT.has(u.k)) { const p = container(u.op, eff(u)); u.parent = p; p.children.push(u); }

  const roots = v && st.only ? groups : groups.concat(top);
  const compact = n => {
    while (n.k === 'package' && n.children.length === 1 && n.children[0].k === 'package') {
      const c = n.children[0];
      n.n += '.' + c.n; n.q = c.q; n.origin = c.origin; n.origins.push(c.origin);
      n.children = c.children; n.children.forEach(g => g.parent = n);
    }
    if (n.clone || n.k === 'group') n.children.forEach(compact);
  };
  roots.forEach(compact);

  const list = [];
  const walk = (n, anc) => {
    n.gen = gen; list.push(n);
    n.anc = anc.concat(n); n.depth = anc.length;
    n.ext = n.k.startsWith('ext');
    n.test = n.test0 || !!(n.parent && LEVEL[n.parent.k] >= 2 && n.parent.test);
    n.file = n.k === 'file' ? n : n.parent ? n.parent.file : null;
    n.type = LEVEL[n.k] === 3 && !n.ext ? n : n.parent ? n.parent.type : null;
    n.group = n.k === 'group' ? n : n.parent ? n.parent.group : null;
    n.loc = n.loc0;
    n.children.forEach(c => walk(c, n.anc));
    n.elems = n.children.reduce((s, c) => s + c.elems + (LEVEL[c.k] >= 3 && !c.ext ? 1 : 0), 0);
    if (CONTAINER.has(n.k) || n.k === 'group') {
      n.test = n.children.length > 0 && n.children.every(c => c.test);
      n.loc = n.children.reduce((s, c) => s + c.loc, 0);
    }
  };
  roots.forEach(r => walk(r, []));
  M = { roots, groups, nodes: list, byKey: new Map(list.map(n => [n.key, n])) };
  if (st.sel) st.sel = M.byKey.get(st.sel.key) || null;
}

function expandTo(L) {
  st.level = L;
  st.expanded.clear();
  for (const n of M.nodes) {
    if (!n.children.length) continue;
    const lv = LEVEL[n.k];
    if (L === 1 ? (n.k === 'group' || n.k === 'module' || n.k === 'ext-root' || (n.k === 'package' && n.children.some(c => c.k === 'package'))) : lv < L)
      st.expanded.add(n.key);
  }
  document.querySelectorAll('#levels button').forEach(b => b.classList.toggle('on', +b.dataset.v === L));
}

// ------------------------------------------------------------------ analysis

// Levelization: per parent, collapse dependencies onto siblings, find cycles (SCCs) and
// assign each sibling a level (0 = depends on no sibling). Sorted top = highest level.
function analyze() {
  for (const n of M.nodes) {
    n.hid = (!st.tests && n.test) || (!st.ext && n.ext);
    n.level = 0; n.scc = null; n.cyc = false; n.sep = false; n.sorted = [];
  }
  const shown = e => e.f.gen === gen && e.t.gen === gen;
  // Hide external types nothing visible depends on (e.g. test libraries when tests are hidden).
  const used = new Set();
  for (const e of D.edges) if (shown(e) && !e.f.hid && e.t.ext) used.add(e.t);
  for (let i = M.nodes.length - 1; i >= 0; i--) {
    const n = M.nodes[i];
    if (!n.ext) continue;
    if (n.k === 'ext-type' ? !used.has(n) : n.children.every(c => c.hid)) n.hid = true;
  }
  active = D.edges.filter(e => shown(e) && !e.f.hid && !e.t.hid);
  const sib = new Map();
  for (const e of active) {
    const A = e.f.anc, B = e.t.anc;
    let i = 0;
    while (i < A.length && i < B.length && A[i] === B[i]) i++;
    if (i === A.length || i === B.length) { e.nest = true; e.a = e.b = null; continue; }
    e.nest = false; e.a = A[i]; e.b = B[i];
    const key = i ? A[i - 1] : null;
    let g = sib.get(key); if (!g) sib.set(key, g = new Map());
    let s = g.get(e.a); if (!s) g.set(e.a, s = new Set());
    s.add(e.b);
  }
  const cycles = {};
  const cycName = n => n.k === 'group' ? 'group' : ['module', 'package', 'file', 'type', 'member'][LEVEL[n.k]];
  const byName = (a, b) => (KRANK[a.k] - KRANK[b.k]) || a.n.localeCompare(b.n);
  let sccN = 0;
  const proc = (parent, kids) => {
    kids = kids.filter(c => !c.hid);
    const g = sib.get(parent) || new Map();
    let index = 0;
    const stack = [], idx = new Map(), low = new Map(), on = new Set(), comps = [];
    const strong = v => { // Tarjan; emits SCCs sinks-first
      idx.set(v, index); low.set(v, index); index++; stack.push(v); on.add(v);
      for (const w of g.get(v) || []) {
        if (!idx.has(w)) { strong(w); low.set(v, Math.min(low.get(v), low.get(w))); }
        else if (on.has(w)) low.set(v, Math.min(low.get(v), idx.get(w)));
      }
      if (low.get(v) === idx.get(v)) {
        const comp = []; let w;
        do { w = stack.pop(); on.delete(w); comp.push(w); } while (w !== v);
        comps.push(comp);
      }
    };
    for (const v of kids) if (!idx.has(v)) strong(v);
    for (const comp of comps) {
      const id = ++sccN;
      for (const v of comp) v.scc = id;
      let lv = 0;
      for (const v of comp) for (const w of g.get(v) || []) if (w.scc !== id && w.scc != null) lv = Math.max(lv, w.level + 1);
      const sk = comp.map(v => (KRANK[v.k] + 1) + '|' + v.n).sort()[0];
      for (const v of comp) { v.level = lv; v.cyc = comp.length > 1; v.sccKey = sk; }
      if (comp.length > 1) { const c = cycName(comp[0]); cycles[c] = (cycles[c] || 0) + 1; }
    }
    if (st.sort === 'levelize') kids.sort((a, b) => (b.level - a.level) || (a.sccKey < b.sccKey ? -1 : a.sccKey > b.sccKey ? 1 : 0) || byName(a, b));
    else if (st.sort === 'loc') kids.sort((a, b) => (b.loc - a.loc) || byName(a, b));
    else if (st.sort === 'elems') kids.sort((a, b) => (b.elems - a.elems) || byName(a, b));
    else kids.sort(byName);
    // Groups stay on top (levelized among themselves), External at the bottom.
    if (!parent) kids = kids.filter(c => c.k === 'group').concat(kids.filter(c => c.k !== 'group' && c.k !== 'ext-root'), kids.filter(c => c.k === 'ext-root'));
    if (st.sort === 'levelize') for (let i = 1; i < kids.length; i++) kids[i].sep = kids[i].level !== kids[i - 1].level || (kids[i].k === 'group') !== (kids[i - 1].k === 'group');
    for (const c of kids) c.sorted = proc(c, c.children);
    return kids;
  };
  M.sorted = proc(null, M.roots);
  for (const e of active) e.cyc = !e.nest && e.a.scc === e.b.scc;

  const vis = M.nodes.filter(n => !n.hid && !n.ext);
  const count = f => vis.filter(f).length;
  const deps = active.filter(e => !e.f.ext).reduce((s, e) => s + e.c, 0);
  const cyc = ['group', 'module', 'package', 'file', 'type', 'member'].filter(k => cycles[k]).map(k => `${cycles[k]} ${k}`).join(', ');
  $('#stats').innerHTML = `${count(n => n.k === 'file')} files · ${count(n => LEVEL[n.k] === 3)} types · ${count(n => LEVEL[n.k] === 4)} members · ${deps} deps · ` +
    (cyc ? `<span style="color:var(--cyc)">cycles: ${cyc}</span>` : 'no cycles') + (D.generated ? ` · ${esc(D.generated)}` : '');
}

// ------------------------------------------------------------------ rendering

function computeRows() {
  for (const n of M.nodes) n.row = -1;
  rows = [];
  const walk = list => { for (const n of list) { n.row = rows.length; rows.push(n); if (st.expanded.has(n.key) && n.sorted.length) walk(n.sorted); } };
  walk(M.sorted);
}

// Nearest visible ancestor-or-self
function rep(n) {
  const A = n.anc;
  for (let i = 0; i < A.length; i++) {
    const a = A[i];
    if (i === A.length - 1 || !st.expanded.has(a.key)) return a.row >= 0 ? a : null;
  }
  return null;
}

function computeArcs() {
  const map = new Map();
  for (const e of active) {
    if (e.nest && !st.nest) continue;
    const rf = rep(e.f), rt = rep(e.t);
    if (!rf || !rt || rf === rt) continue;
    const key = rf.key + '>' + rt.key;
    let a = map.get(key);
    if (!a) map.set(key, a = { key, from: rf, to: rt, count: 0, edges: [], cyc: false, nest: e.nest });
    a.count += e.c; a.edges.push(e); a.cyc = a.cyc || e.cyc;
  }
  return [...map.values()];
}

let measureCtx = null;
function textWidth(s) {
  if (!measureCtx) { measureCtx = document.createElement('canvas').getContext('2d'); measureCtx.font = getComputedStyle(document.body).font; }
  return measureCtx.measureText(s).width;
}

const icon = n => n.k === 'group'
  ? `<span class="ic k-group" style="--gc:${esc(n.color)}"></span>`
  : `<span class="ic k-${n.k}${n.v === '-' && LEVEL[n.k] === 4 ? ' priv' : ''}"></span>`;

function rowHTML(n) {
  const cls = ['row', 'd' + Math.min(n.depth, 7)];
  if (n.sep) cls.push('sep');
  if (n.cyc) cls.push('cyc');
  if (st.sel === n) cls.push('sel');
  if (n.group) cls.push('ing');
  if (n.k === 'group') cls.push('grp');
  if (st.query && n.n.toLowerCase().includes(st.query)) cls.push('match');
  const open = st.expanded.has(n.key), has = n.sorted.length > 0;
  const drag = curView() && assignTarget(n) ? ' draggable="true"' : '';
  const style = `padding-left:${6 + n.depth * IND}px${n.group ? `;--gc:${esc(n.group.color)}` : ''}`;
  let body;
  if (n.k === 'group') {
    body = (st.editing === n.key ? `<input class="gname" value="${esc(n.n)}" spellcheck="false">` : `<span class="nm">${esc(n.n)}</span>`) +
      (n.children.length ? '' : `<span class="metric">empty — drag packages or files here</span>`) +
      `<span class="gact"><button data-act="rename" title="Rename group">Rename</button><button data-act="delete" title="Delete group">Delete</button></span>`;
  } else {
    const metric = st.sort === 'loc' ? n.loc : st.sort === 'elems' ? n.elems : '';
    body = `<span class="nm${n.test ? ' test' : ''}${n.st ? ' stat' : ''}">${esc(n.n)}</span>` + (metric !== '' ? `<span class="metric">${metric}</span>` : '');
  }
  const title = `${KIND_LABEL[n.k] || n.k}: ${n.q}${n.cyc ? ' — part of a cycle' : ''}${drag ? ' — drag onto a group to assign' : ''}`;
  return `<div class="${cls.join(' ')}"${drag} style="${style}" title="${esc(title)}">` +
    `<span class="tog${has ? '' : ' none'}">${open ? '−' : '+'}</span>${icon(n)}${body}</div>`;
}

function draw() {
  if (!M) return;
  computeRows();
  rowsEl.innerHTML = rows.map(rowHTML).join('');
  const W = view.clientWidth, HT = rows.length * H;
  let maxLabel = 0;
  for (const n of rows) maxLabel = Math.max(maxLabel, 6 + n.depth * IND + 19 + 22 + textWidth(n.n) + (st.sort === 'loc' || st.sort === 'elems' ? 44 : 0));
  const ax = Math.round(Math.min(Math.max(maxLabel + 36, W * 0.5), Math.max(maxLabel + 36, W - 110)));
  const width = Math.max(W, ax + 110);
  const maxL = ax - 8, maxR = Math.max(24, width - ax - 14);
  arcs = computeArcs();
  rowArcs = new Map();
  const add = (n, i) => { let l = rowArcs.get(n); if (!l) rowArcs.set(n, l = []); l.push(i); };
  arcs.sort((a, b) => Math.abs(b.to.row - b.from.row) - Math.abs(a.to.row - a.from.row)); // long arcs below short ones
  let paths = '', hits = '';
  arcs.forEach((a, i) => {
    const y1 = a.from.row * H + H / 2, y2 = a.to.row * H + H / 2, up = y2 < y1;
    const ry = Math.abs(y2 - y1) / 2, rx = Math.max(5, Math.min(ry, up ? maxR : maxL));
    const dir = up ? 1 : -1;
    a.cls = a.nest ? 'nest' : a.cyc && up ? 'cyc' : up ? 'up' : 'down';
    const d = `M${ax + dir * 5} ${y1}A${rx.toFixed(1)} ${ry} 0 0 0 ${ax + dir * 8} ${y2}`;
    const w = (1.1 + Math.min(2.6, Math.log2(a.count) * 0.55)).toFixed(2);
    paths += `<path class="arc ${a.cls}" data-a="${i}" d="${d}" stroke-width="${w}" marker-end="url(#m-${a.cls})"/>`;
    hits += `<path class="hit" data-a="${i}" d="${d}"><title>${esc(a.from.n)} → ${esc(a.to.n)} (${a.count})</title></path>`;
    add(a.from, i); add(a.to, i);
  });
  let anchors = '';
  for (const n of rowArcs.keys()) anchors += `<circle class="anc" data-r="${n.row}" cx="${ax}" cy="${n.row * H + H / 2}" r="4"/>`;
  const marker = c => `<marker id="m-${c}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0L10,5L0,10z" style="fill:var(--${c})"/></marker>`;
  svg.setAttribute('width', width);
  svg.setAttribute('height', HT);
  svg.innerHTML = `<defs>${['down', 'up', 'cyc', 'nest'].map(marker).join('')}</defs>${paths}${anchors}${hits}`;
  rowsEl.style.width = width + 'px';
  rowsEl.style.height = HT + 'px';
  if (st.selArc) st.selArc = arcs.find(x => x.key === st.selArc.key) || null;
  focus();
  const input = rowsEl.querySelector('.gname');
  if (input) { input.focus(); input.select(); }
}

function focus() {
  const fa = st.hoverArc || st.selArc;
  const fn = fa ? null : (st.hover || (st.sel && st.sel.row >= 0 ? st.sel : null));
  const on = new Set(), peers = new Set();
  if (fa) { on.add(arcs.indexOf(fa)); peers.add(fa.from); peers.add(fa.to); }
  else if (fn) for (const i of rowArcs.get(fn) || []) { on.add(i); peers.add(arcs[i].from); peers.add(arcs[i].to); }
  svg.classList.toggle('focus', !!(fa || fn));
  svg.querySelectorAll('path.arc').forEach(p => p.classList.toggle('on', on.has(+p.dataset.a)));
  svg.querySelectorAll('circle.anc').forEach(c => c.classList.toggle('on', peers.has(rows[+c.dataset.r])));
  const rs = rowsEl.children;
  for (let i = 0; i < rs.length; i++) rs[i].classList.toggle('peer', peers.has(rows[i]) && rows[i] !== fn);
}

function refresh() { analyze(); draw(); showPanel(); }

// ------------------------------------------------------------------ panel

const within = (x, n) => x.anc[n.depth] === n;
const short = n => n.ext ? n.q : LEVEL[n.k] === 4 && n.parent ? n.parent.n + '.' + n.n : n.n;
const where = e => {
  const f = e.f.file;
  return f ? `${f.n}:${e.lines.slice(0, 6).join(', ')}${e.lines.length > 6 ? '…' : ''}` : '';
};
const edgeLi = e => `<li data-k="${esc(e.f.key)}"><span class="kind">${esc(e.k)}</span>${esc(short(e.f))} → ${esc(short(e.t))}` +
  `${e.c > 1 ? ` <span class="cnt">×${e.c}</span>` : ''}<span class="where">${esc(where(e))}</span></li>`;
const origLabel = o => o.k === 'file' ? (o.path || o.n) : o.q || o.n;

function groupList(edges, side) {
  const groups = new Map();
  for (const e of edges) {
    const other = side === 'out' ? e.t : e.f;
    const r = rep(other) || other;
    let g = groups.get(r); if (!g) groups.set(r, g = { n: r, c: 0, edges: [], cyc: false });
    g.c += e.c; g.edges.push(e); g.cyc = g.cyc || e.cyc;
  }
  const list = [...groups.values()].sort((a, b) => b.c - a.c);
  if (!list.length) return '<p class="help">None.</p>';
  return list.map(g => `<details${list.length === 1 ? ' open' : ''}><summary>${icon(g.n)}<span class="nm" style="${g.cyc ? 'color:var(--cyc)' : ''}">${esc(g.n.n)}</span><span class="cnt">${g.c}</span></summary>` +
    `<ul>${g.edges.slice(0, 300).map(edgeLi).join('')}</ul></details>`).join('');
}

function groupSelect(n) {
  const v = curView(), o = assignTarget(n);
  if (!v || !o) return '';
  let cur = null;
  for (let a = o; a; a = a.op) if (hasOwn(v.assign, a.okey)) { cur = v.assign[a.okey] || null; break; }
  const opts = `<option value="">(none)</option>` + v.groups.map(g => `<option value="${esc(g.id)}"${g.id === cur ? ' selected' : ''}>${esc(g.name)}</option>`).join('');
  const what = o === n || (n.origins && n.origins.includes(o)) ? '' : ` <span class="sub">(${esc(o.n)})</span>`;
  return `<span>Group</span><span><select data-assign="${esc(o.okey)}">${opts}</select>${what}</span>`;
}

function showPanel() {
  if (!M) { pbody.innerHTML = ''; return; }
  if (st.selArc) {
    const a = st.selArc;
    pbody.innerHTML = `<h2>${icon(a.from)}${esc(a.from.n)}</h2><div class="sub" style="margin:2px 0 2px 22px">depends on</div><h2>${icon(a.to)}${esc(a.to.n)}</h2>` +
      `<div class="kv"><span>References</span><span>${a.count}</span>${a.cyc ? '<span>Cycle</span><span style="color:var(--cyc)">yes — the two sides depend on each other</span>' : ''}</div>` +
      `<h3>Dependencies</h3><ul style="padding-left:0">${a.edges.slice(0, 500).map(edgeLi).join('')}</ul>`;
    return;
  }
  const n = st.sel;
  if (!n) {
    const v = curView();
    pbody.innerHTML = `<h3 style="margin-top:0">Legend</h3><div class="legend">
      <i style="border-color:var(--down)"></i><span>Downward dependency (left side)</span>
      <i style="border-color:var(--up)"></i><span>Upward dependency (right side)</span>
      <i style="border-color:var(--cyc)"></i><span>Upward dependency that closes a cycle</span>
      <i style="border-color:var(--nest);border-top-style:dashed"></i><span>Dependency on own parent (“Parent deps”)</span></div>
      <div class="help"><h3>Groups &amp; views</h3>
      ${v ? `<p>You are in the view <b>${esc(v.name)}</b>. Drag packages, files or modules onto a group row (or pick a group in the details of a selected element). Assigning a package moves everything inside it; a more specific assignment wins. Drag something back onto an ungrouped row to remove it from its group.</p>
      <p>Collapse the groups to see the dependencies between them. Levelize orders them so that every group only depends on groups below it, and red arcs show where that is broken.</p>`
        : `<p>Click <b>+ Group</b> to create a view with an empty group, then drag packages or files onto it. Use several views to look at the code from different angles: layers, bounded contexts, patterns…</p>`}
      <p>Views are saved in this browser. Use ⋯ › Export views to keep or share them.</p>
      <h3>How to use</h3>
      <p>Arcs connect the rows that are currently visible: collapsing a node rolls up all dependencies of its contents onto it.</p>
      <p><b>Levelize</b> orders siblings so that each one only depends on rows below it. Lines separate levels; a red bar marks elements that are part of a cycle.</p>
      <p>Hover a row or arc to highlight it, click to see the individual references with line numbers. Double-click a row (or click +/−) to expand it.</p>
      ${D.errors ? `<p>The scan reported ${D.errors} compile errors; references that could not be resolved are listed under External › (unresolved).</p>` : ''}</div>`;
    return;
  }
  const out = active.filter(e => within(e.f, n) && !within(e.t, n) && (!e.nest || st.nest));
  const inc = active.filter(e => within(e.t, n) && !within(e.f, n) && (!e.nest || st.nest));
  const sum = l => l.reduce((s, e) => s + e.c, 0);
  const cycWith = n.cyc ? (n.parent ? n.parent.sorted : M.sorted).filter(x => x !== n && x.scc === n.scc) : [];
  const kv = [['Kind', (KIND_LABEL[n.k] || n.k) + (n.v && VIS[n.v] && !n.ext ? ` · ${VIS[n.v]}` : '') + (n.st ? ' · static' : '')]];
  if (n.file && LEVEL[n.k] >= 2 && !n.ext) kv.push(['Location', `${n.file.path || n.file.n}${n.line > 1 ? ':' + n.line : ''}`]);
  if (n.loc) kv.push(['Lines', n.loc]);
  if (n.elems) kv.push(['Elements', n.elems]);
  if (st.sort === 'levelize') kv.push(['Level', n.level]);
  let extra = '';
  if (n.k === 'group') {
    const v = curView();
    const items = Object.entries(v.assign).filter(([, g]) => g === n.gid).map(([k]) => D.byOKey.get(k)).filter(Boolean)
      .sort((a, b) => origLabel(a).localeCompare(origLabel(b)));
    extra = `<h3>Assigned (${items.length})</h3>` + (items.length
      ? `<ul style="padding-left:0">${items.map(o => `<li data-o="${esc(o.okey)}"><button class="x" data-unassign="${esc(o.okey)}" title="Remove from group">✕</button>${icon(o)}${esc(origLabel(o))}</li>`).join('')}</ul>`
      : `<p class="help">Nothing yet. Drag packages, files or modules onto the group row.</p>`);
  }
  const gs = groupSelect(n);
  pbody.innerHTML = `<h2>${icon(n)}${esc(n.n)}${n.cyc ? '<span class="badge">cycle</span>' : ''}</h2>` +
    (n.q !== n.n ? `<div class="sub">${esc(n.q)}</div>` : '') +
    `<div class="kv">${kv.map(([k, v]) => `<span>${k}</span><span>${esc(v)}</span>`).join('')}${gs}</div>` + extra +
    (cycWith.length ? `<h3 style="color:var(--cyc)">In a cycle with</h3><ul style="padding-left:0">${cycWith.map(x => `<li data-k="${esc(x.key)}">${icon(x)}${esc(x.n)}</li>`).join('')}</ul>` : '') +
    `<h3>Depends on (${sum(out)})</h3>${groupList(out, 'out')}` +
    `<h3>Used by (${sum(inc)})</h3>${groupList(inc, 'in')}`;
}

// ------------------------------------------------------------------ interaction

const nodeAt = el => { const r = el.closest && el.closest('.row'); return r ? rows[[...rowsEl.children].indexOf(r)] : null; };

function reveal(n, select = true) {
  if (n.hid) {
    if (n.test) { st.tests = true; $('#optTests').checked = true; }
    if (n.ext) { st.ext = true; $('#optExt').checked = true; }
    analyze();
  }
  for (const a of n.anc.slice(0, -1)) st.expanded.add(a.key);
  if (select) { st.sel = n; st.selArc = null; }
  draw(); showPanel();
  const y = n.row * H;
  if (y < view.scrollTop || y > view.scrollTop + view.clientHeight - H) view.scrollTop = y - view.clientHeight / 2;
}

function toggle(n) {
  if (!n.sorted.length) return;
  st.expanded.has(n.key) ? st.expanded.delete(n.key) : st.expanded.add(n.key);
  document.querySelectorAll('#levels button').forEach(b => b.classList.remove('on'));
  draw();
  if (st.sel) showPanel();
}

function select(n) {
  st.sel = st.sel === n ? null : n; st.selArc = null;
  rowsEl.querySelectorAll('.row.sel').forEach(r => r.classList.remove('sel'));
  if (st.sel) rowsEl.children[n.row].classList.add('sel');
  focus(); showPanel();
}

function commitEdit(input, save) {
  const n = M.byKey.get(st.editing);
  st.editing = null;
  if (save && n) renameGroup(n.gid, input.value);
  build(); refresh();
}

rowsEl.addEventListener('click', ev => {
  if (ev.target.classList.contains('gname')) return;
  const n = nodeAt(ev.target); if (!n) return;
  const act = ev.target.dataset && ev.target.dataset.act;
  if (act === 'rename') { st.editing = n.key; draw(); return; }
  if (act === 'delete') return deleteGroup(n.gid);
  if (ev.target.classList.contains('tog')) return toggle(n);
  select(n);
});
rowsEl.addEventListener('dblclick', ev => {
  const n = nodeAt(ev.target);
  if (!n || ev.target.classList.contains('tog') || ev.target.closest('.gact') || ev.target.classList.contains('gname')) return;
  if (n.k === 'group' && ev.target.classList.contains('nm')) { st.editing = n.key; draw(); return; }
  toggle(n);
});
rowsEl.addEventListener('keydown', ev => {
  if (!ev.target.classList.contains('gname')) return;
  if (ev.key === 'Enter') commitEdit(ev.target, true);
  else if (ev.key === 'Escape') commitEdit(ev.target, false);
  ev.stopPropagation();
});
rowsEl.addEventListener('focusout', ev => { if (ev.target.classList.contains('gname') && st.editing) commitEdit(ev.target, true); });
rowsEl.addEventListener('mousemove', ev => { const n = nodeAt(ev.target); if (n !== st.hover) { st.hover = n; focus(); } });
rowsEl.addEventListener('mouseleave', () => { st.hover = null; focus(); });

// Drag & drop assignment
let dragKey = null, dropRow = null;
const setDrop = el => { if (dropRow === el) return; if (dropRow) dropRow.classList.remove('drop'); dropRow = el; if (el) el.classList.add('drop'); };
rowsEl.addEventListener('dragstart', ev => {
  const n = nodeAt(ev.target), o = assignTarget(n);
  if (!o || !curView()) { ev.preventDefault(); return; }
  dragKey = o.okey;
  ev.dataTransfer.setData('text/plain', origLabel(o));
  ev.dataTransfer.effectAllowed = 'move';
  document.body.classList.add('dragging');
});
rowsEl.addEventListener('dragover', ev => {
  if (!dragKey) return;
  ev.preventDefault();
  const n = nodeAt(ev.target);
  setDrop(n && n.group ? rowsEl.children[n.group.row] : null);
  ev.dataTransfer.dropEffect = 'move';
});
rowsEl.addEventListener('drop', ev => {
  if (!dragKey) return;
  ev.preventDefault(); ev.stopPropagation();
  const n = nodeAt(ev.target), key = dragKey;
  dragKey = null; setDrop(null); document.body.classList.remove('dragging');
  if (n) assign(key, n.group ? n.group.gid : null);
});
rowsEl.addEventListener('dragend', () => { dragKey = null; setDrop(null); document.body.classList.remove('dragging'); });

svg.addEventListener('mouseover', ev => { if (ev.target.classList.contains('hit')) { st.hoverArc = arcs[+ev.target.dataset.a]; focus(); } });
svg.addEventListener('mouseout', ev => { if (ev.target.classList.contains('hit')) { st.hoverArc = null; focus(); } });
svg.addEventListener('click', ev => {
  if (!ev.target.classList.contains('hit')) return;
  const a = arcs[+ev.target.dataset.a];
  st.selArc = st.selArc === a ? null : a; st.sel = null;
  rowsEl.querySelectorAll('.row.sel').forEach(r => r.classList.remove('sel'));
  focus(); showPanel();
});

pbody.addEventListener('click', ev => {
  const x = ev.target.closest('[data-unassign]');
  if (x) { assign(x.dataset.unassign, null); return; }
  const li = ev.target.closest('li'); if (!li) return;
  let n = null;
  if (li.dataset.k) n = M.byKey.get(li.dataset.k);
  else if (li.dataset.o) { const o = D.byOKey.get(li.dataset.o); n = o && findDisplay(o); }
  if (n) reveal(n);
});
pbody.addEventListener('change', ev => {
  if (ev.target.dataset.assign) assign(ev.target.dataset.assign, ev.target.value || null);
});
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape' && !/INPUT|SELECT|TEXTAREA/.test(ev.target.tagName)) { st.sel = st.selArc = null; draw(); showPanel(); }
});

$('#sort').addEventListener('click', ev => {
  const b = ev.target.closest('button'); if (!b || !M) return;
  st.sort = b.dataset.v;
  document.querySelectorAll('#sort button').forEach(x => x.classList.toggle('on', x === b));
  refresh();
});
$('#levels').addEventListener('click', ev => {
  const b = ev.target.closest('button'); if (!b || !M) return;
  expandTo(+b.dataset.v); draw(); showPanel();
});
const opt = (id, key, rebuild) => $(id).addEventListener('change', ev => {
  st[key] = ev.target.checked;
  if (!M) return;
  if (rebuild) build();
  analyze();
  if (st.sel && (st.sel.hid || st.sel.gen !== gen)) st.sel = null;
  st.selArc = null; draw(); showPanel();
});
opt('#optTests', 'tests'); opt('#optExt', 'ext'); opt('#optNest', 'nest'); opt('#optOnly', 'only', true);

$('#viewSel').addEventListener('change', ev => D && switchView(ev.target.value));
$('#addGroup').addEventListener('click', addGroup);
$('#viewMenu').addEventListener('click', ev => {
  const b = ev.target.closest('button[data-m]'); if (!b || !D) return;
  $('#viewMenu').open = false;
  const v = curView();
  switch (b.dataset.m) {
    case 'new': { const name = prompt('Name of the new view:', 'View ' + (V.views.length + 1)); if (name) newView(name.trim() || 'View'); break; }
    case 'dup': {
      if (!v) return alert('Select a view first.');
      const c = JSON.parse(JSON.stringify(v)); c.id = uid(); c.name = v.name + ' (copy)';
      V.views.push(c); switchView(c.id); break;
    }
    case 'rename': {
      if (!v) return alert('Select a view first.');
      const name = prompt('Rename view:', v.name);
      if (name && name.trim()) { v.name = name.trim(); saveViews(); renderViewSel(); }
      break;
    }
    case 'delete':
      if (!v) return alert('Select a view first.');
      if (confirm(`Delete view "${v.name}" with ${v.groups.length} group(s)?`)) { V.views = V.views.filter(x => x !== v); switchView(null); }
      break;
    case 'export': {
      const blob = new Blob([JSON.stringify({ views: V.views }, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = D.title.replace(/[^\w.-]+/g, '_') + '-views.json';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
      break;
    }
    case 'import': $('#viewFile').click(); break;
  }
});
document.addEventListener('click', ev => { const m = $('#viewMenu'); if (m.open && !m.contains(ev.target)) m.open = false; });
$('#viewFile').addEventListener('change', ev => {
  const f = ev.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const data = JSON.parse(r.result);
      const views = Array.isArray(data) ? data : data.views;
      if (!Array.isArray(views)) throw new Error('no "views" array');
      for (const v of views) {
        v.groups = v.groups || []; v.assign = v.assign || {};
        V.views = V.views.filter(x => x.id !== v.id).concat(v);
      }
      if (views.length) switchView(views[0].id);
    } catch (e) { alert('Could not import ' + f.name + ': ' + e.message); }
    ev.target.value = '';
  };
  r.readAsText(f);
});

$('#find').addEventListener('input', ev => {
  st.query = ev.target.value.trim().toLowerCase(); st.findPos = -1;
  rowsEl.querySelectorAll('.row').forEach((r, i) => r.classList.toggle('match', !!st.query && rows[i].n.toLowerCase().includes(st.query)));
});
$('#find').addEventListener('keydown', ev => {
  if (ev.key !== 'Enter' || !st.query || !M) return;
  const order = [];
  const walk = l => l.forEach(n => { order.push(n); walk(n.sorted); });
  walk(M.sorted);
  const hits = order.filter(n => n.n.toLowerCase().includes(st.query));
  if (!hits.length) return;
  st.findPos = (st.findPos + (ev.shiftKey ? -1 : 1) + hits.length) % hits.length;
  reveal(hits[st.findPos]);
});

function readFile(f) {
  const r = new FileReader();
  r.onload = () => { try { load(JSON.parse(r.result)); } catch (e) { alert('Could not read ' + f.name + ': ' + e.message); } };
  r.readAsText(f);
}
const isFileDrag = ev => ev.dataTransfer && [...ev.dataTransfer.types].includes('Files');
$('#file').addEventListener('change', ev => ev.target.files[0] && readFile(ev.target.files[0]));
window.addEventListener('dragover', ev => { if (isFileDrag(ev)) { ev.preventDefault(); document.body.classList.add('drag'); } });
window.addEventListener('dragleave', () => document.body.classList.remove('drag'));
window.addEventListener('drop', ev => {
  if (!isFileDrag(ev)) return;
  ev.preventDefault(); document.body.classList.remove('drag');
  const f = ev.dataTransfer.files[0]; if (f) readFile(f);
});

let raf = 0, lastW = 0;
new ResizeObserver(() => { if (view.clientWidth === lastW) return; lastW = view.clientWidth; cancelAnimationFrame(raf); raf = requestAnimationFrame(draw); }).observe(view);

const param = new URLSearchParams(location.search).get('data');
if (EMBEDDED) load(EMBEDDED);
else if (param) fetch(param).then(r => r.json()).then(load).catch(e => { $('#empty').hidden = false; alert('Could not load ' + param + ': ' + e.message); });
else { $('#empty').hidden = false; renderViewSel(); showPanel(); }
})();
</script>
</body>
</html>
