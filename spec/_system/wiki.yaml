# Project identity for this requirements wiki.
#
# The dashboard reads this file live; edit it and refresh the browser.
system_name: "depviewer"  # the system whose requirements this vault holds
tagline: "Requirements and architecture of depviewer"  # one line, shown under the name in the dashboard hero
# about: docs/<folder>/README.md  # optional: a page under docs/ shown at /about (hero mark + link)
# about_label: ""                  # optional: link text and page title; empty → "About <system_name>"
default_notation: prose          # notation for new functional requirements; the existing ones are all prose
# brand: brand/                    # optional: a folder with this wiki's marks, favicon and intro; empty → systems42
dashboard_version: "0.15.0"  # the dashboard release this wiki runs; `./dashboard.sh update` names the newest
